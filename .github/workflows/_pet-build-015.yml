name: pet-build-0.1.15

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.event.head_commit.message == 'chore: run 0.1.15 build'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply interaction and visual-platform patch
        run: python scripts/_pet_patch_015.py

      - name: Syntax check
        shell: bash
        run: |
          node --check packages/cortico-world-desktop-pet/host/windows-platforms.cjs
          node --check packages/cortico-world-desktop-pet/host/electron-main.cjs
          node --check packages/cortico-world-desktop-pet/web/pet-core.js
          node --check packages/cortico-world-desktop-pet/web/pet-core-platforms.js
          node --check packages/cortico-world-desktop-pet/web/pet-app.js

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm run build:installer
        env:
          PACK_ARCH: x64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Coopanion-Windows-Test-0.1.15
          path: dist/Coopanion-Setup-0.1.15.exe
          if-no-files-found: error

      - name: Commit patched main
        shell: bash
        run: |
          git config user.name "j955229"
          git config user.email "120770154+j955229@users.noreply.github.com"
          git add -A
          git commit -m "feat: visual platforms and stronger pointer reactions"
          git push origin HEAD:main

# second push intentionally triggers this newly registered workflow
