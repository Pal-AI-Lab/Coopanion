name: pet-interaction-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: python scripts/_pet_patch.py
      - run: node --check packages/cortico-world-desktop-pet/web/pet-core.js
      - run: node --check packages/cortico-world-desktop-pet/web/pet-core-platforms.js
      - run: node --check packages/cortico-world-desktop-pet/web/pet-app.js
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:installer
        env:
          PACK_ARCH: x64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Coopanion-Windows-Test-0.1.14
          path: dist/Coopanion-Setup-0.1.14.exe
          if-no-files-found: error
      - shell: bash
        run: |
          git config user.name "j955229"
          git config user.email "120770154+j955229@users.noreply.github.com"
          git add -A
          git commit -m "feat: richer pet physics and pointer interactions"
          git push origin HEAD:main
