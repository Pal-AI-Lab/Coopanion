<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The sandbox a figure pack's body runs in (figure-frame.js). The server sends it with a CSP that
     sandboxes it and allows no connection; the pet page talks to it by postMessage only. -->
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
#root { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" aria-hidden="true"></div>
<script type="module" src="/web/figure-frame.js"></script>
</body>
</html>
