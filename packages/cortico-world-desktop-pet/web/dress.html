<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortico</title>
<link rel="stylesheet" href="/web/pet.css">
<link rel="stylesheet" href="/web/dress.css">
<link rel="stylesheet" href="/web/dist/dress-dialog.css">
</head>
<body class="dress-page">
<main>
  <div class="preview" id="preview" data-i18n-label="dress.preview">
    <div class="floor" id="floor" aria-hidden="true"></div>
    <div class="figure-layer" id="figureLayer"></div>
    <div class="corner">
      <p class="saved" id="saved" aria-live="polite"></p>
      <button type="button" class="save-look" id="updateLook" hidden></button>
      <button type="button" class="save-look" id="saveLook"></button>
    </div>
  </div>
  <div class="dress" id="dress">
    <h2 class="section-head first" id="lbLooks" data-i18n="looks.title"></h2><div class="slot looks" id="optLooks" role="group" aria-labelledby="lbLooks"></div>
    <h2 class="section-head" data-i18n="dress.custom"></h2>
    <div class="row-label" id="lbFigure" data-i18n="dress.figure"></div><div class="slot" id="optFigure" role="group" aria-labelledby="lbFigure"></div>
    <div class="row-label coo-only" id="lbPalette" data-i18n="dress.palette"></div><div class="slot coo-only" id="optPalette" role="group" aria-labelledby="lbPalette"></div>
    <div class="row-label coo-only" id="lbHead" data-i18n="dress.head"></div><div class="slot coo-only" id="optHead" role="group" aria-labelledby="lbHead"></div>
    <div class="row-label coo-only" id="lbSide" data-i18n="dress.side"></div><div class="slot coo-only" id="optSide" role="group" aria-labelledby="lbSide"></div>
    <div class="row-label coo-only" id="lbGlasses" data-i18n="dress.glasses"></div><div class="slot coo-only" id="optGlasses" role="group" aria-labelledby="lbGlasses"></div>
    <div class="row-label coo-only" id="lbNeck" data-i18n="dress.neck"></div><div class="slot coo-only" id="optNeck" role="group" aria-labelledby="lbNeck"></div>
  </div>
</main>
<div class="drop-hint" id="dropHint" hidden><p data-i18n="dress.dropHint"></p></div>
<script type="module" src="/web/dress.js"></script>
</body>
</html>
